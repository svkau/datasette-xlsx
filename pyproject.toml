[project]
name = "datasette-xlsx"
version = "0.2.2"
description = "Exportera tabeller och frågeresultat från Datasette som Excel (.xlsx)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Svenska kyrkans arkiv i Uppsala" },
]
keywords = ["datasette", "datasette-plugin", "excel", "xlsx", "export"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Datasette",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Swedish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "datasette>=0.64",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/svkau/datasette-xlsx"
Issues = "https://github.com/svkau/datasette-xlsx/issues"
Changelog = "https://github.com/svkau/datasette-xlsx/releases"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.entry-points.datasette]
xlsx = "datasette_xlsx"

[build-system]
# setuptools 77 krävs för SPDX-uttryck i `license` (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datasette_xlsx"]
